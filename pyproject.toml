[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baseward"
version = "0.0.1"
description = "The warden between AI and your data — MCP database gateway with token scopes, column masking and audit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The BaseWard Authors" }]
keywords = ["mcp", "database", "gateway", "sql", "mysql", "ai", "security", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "mcp==1.30.0",
    "mysql-mimic==3.0.5",
    "prometheus-client>=0.20,<1.0",
    "sqlglot==30.24.0",
    "sqlalchemy>=2.0.30,<3.0",
    "greenlet>=3.0,<4.0",
    "aiomysql>=0.3,<1.0",
    "aiosqlite>=0.20,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic-settings>=2.4,<3.0",
    "cryptography>=50,<51",
    "bcrypt>=4.1,<6.0",
    "itsdangerous>=2.2,<3.0",
    "tzdata>=2024.1",
    "python-multipart>=0.0.9,<1.0",
]

[project.scripts]
baseward = "app.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "asgi-lifespan>=2.1,<3.0",
    "pymysql>=1.1,<2.0",
    "ruff>=0.9,<1.0",
    "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["app*", "migrations"]

[tool.setuptools.package-data]
app = ["admin/templates/*.html", "admin/static/*"]
migrations = ["*.sql"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/perf/*" = ["E402"]
