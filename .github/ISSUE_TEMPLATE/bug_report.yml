name: Bug report
description: Something is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security vulnerability?** Do not file it here — follow the private reporting process in [SECURITY.md](https://github.com/billsking/baseward/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Call ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BaseWard version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - pip / source
        - Other
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Upstream database engine and version
      placeholder: "MySQL 8.0 / MariaDB 11.8 / TiDB v8.5 / OceanBase CE 4.4 / ..."
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Gateway logs or MCP error payloads. Redact tokens, passwords and personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true