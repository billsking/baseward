name: Feature request
description: Suggest an idea for BaseWard
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that BaseWard does not support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like BaseWard to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Deployment shape, upstream engine, MCP client, links, screenshots.